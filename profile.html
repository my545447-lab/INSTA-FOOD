<!DOCTYPE html>

</div>

<header>
    <div class="nav-group">
        <div class="logo-group">
            <img src="assets/svg/insta food (3).png" alt="Insta Food logo">
            <h1>INSTA FOOD</h1>
        </div>
        <nav>
            <ul>
                <a href="index.html">الصفحة الرئيسية</a>

                <li><a href="index.html#footer">اتصل بنا</a></li>

    <div class="header-actions">

<main class="profile-page">

            <div class="profile-avatar" id="profile-avatar">👤</div>
            <div class="profile-info">

            <button id="logout-btn" class="logout-btn">تسجيل الخروج</button>
        </div>

        <!-- تاريخ الطلبات -->
        <div class="orders-section">
            <h2>طلباتي السابقة</h2>
            <div id="orders-list">
                <div class="orders-loading">جاري التحميل...</div>
            </div>
        </div>

    </div>
</main>

<footer id="footer" class="site-footer">
    <div class="footer-container">
        <div class="footer-brand">
            <div class="logo-group">
                <img src="assets/svg/insta food (3).png" alt="Insta Food Logo">

            </div>
            <p class="footer-tagline">طعام لذيذ طازج يصل إلى باب منزلك.</p>
        </div>
        <div class="footer-social">
            <p class="follow-us">تابعنا</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/instafood.eg" class="social-icon" target="_blank">
                    <img src="assets/svg/social/images-removebg-preview (3).png" alt="Facebook">
                </a>
                <a href="https://www.instagram.com/instafood697" class="social-icon" target="_blank">
                    <img src="assets/svg/social/images-removebg-preview (4).png" alt="Instagram">
                </a>

            <p class="call-us">Call us: 01092009691</p>
        </div>
    </div>

<script src="cart.js"></script>
