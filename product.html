<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="cart-styles.css" />
    <link rel="stylesheet" href="product-styles.css" />
    <title>تفاصيل المنتج - INSTA FOOD</title>
</head>
<body>

    <div class="top-bar">
    </div>
    <header>
    </header>

    <main class="product-page">
        <div class="product-page-inner">

            <div class="product-main">
                <img id="product-img" src="" alt="">
                <div class="product-main-info">
                    <h1 id="product-name"></h1>
                    <p id="product-desc"></p>
                    <div id="size-picker" class="size-picker"></div>

                    <p class="product-base-price">EGP <span id="product-unit-price"></span></p>

                    <div class="qty-control">
                        <button type="button" id="main-qty-minus" class="qty-btn minus">−</button>
                        <span id="main-qty" class="qty-value">1</span>
                        <button type="button" id="main-qty-plus" class="qty-btn plus">+</button>
                    </div>
                </div>
            </div>

            <div class="addon-section">
                <h2>ضيف مقبلات</h2>
                <div id="extras-list" class="addon-list"></div>
            </div>

            <div class="addon-section">
                <h2>ضيف مشروبات</h2>
                <div id="drinks-list" class="addon-list"></div>
            </div>

        </div>
    </main>

    <div class="product-footer-bar">
        <div class="product-total-wrapper">
            <span>الاجمالي</span>
            <span id="product-total" class="product-total">EGP 0</span>
        </div>
        <a href="cart.html" class="go-to-cart-btn">العربة 🛒</a>
        <button id="add-to-cart-btn" class="add-all-btn" type="button">إضافة للعربة</button>
    </div>

    <div id="toast" class="toast"></div>

    <footer class="site-footer">
    </footer>

    <script src="product-data.js"></script>
    <script src="cart.js"></script>
    <script src="product.js"></script>
</body>
</html>
